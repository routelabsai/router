server:
  port: 8000

routing:
  default_mode: balanced
  escalate_on_verification_failure: true
  prefer_local_for_private: true

providers:
  local:
    default: ollama
    ollama:
      model: qwen3:4b
      embedding_model: embeddinggemma
  cloud:
    default: openai-compatible
    openai_compatible:
      model: gpt-4.1-mini
      embedding_model: text-embedding-3-small

policies:
  privacy:
    deny_cloud_when_private: true
  complexity:
    local_max: medium
  tools:
    approval_required_patterns:
      - "write"
      - "delete"
      - "deploy"
      - "shell"
      - "exec"
      - "terminal"
      - "mcp__openclaw__shell_*"
      - "mcp__openclaw__filesystem__write*"
      - "mcp__openclaw__email__send*"
      - "mcp__openclaw__github__merge*"
    review_recommended_patterns:
      - "read"
      - "search"
      - "browser"
      - "web"
      - "database"
      - "issue"
      - "ticket"
      - "mcp__openclaw__browser__*"
      - "mcp__openclaw__github__*"
    trusted_tool_patterns:
      - "mcp__openclaw__memory__read*"

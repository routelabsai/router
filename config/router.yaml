server:
  host: "127.0.0.1"
  port: 8000

routing:
  default_mode: "balanced"
  escalate_on_verification_failure: true
  prefer_local_for_private: true

providers:
  local:
    default: "ollama"
    ollama:
      base_url: "http://127.0.0.1:11434"
      model: "qwen3:4b"
      embedding_model: "embeddinggemma"
      timeout_seconds: 60
      max_retries: 2
    llamacpp:
      base_url: "http://127.0.0.1:8080"
      model: "qwen3-4b-instruct"
      embedding_model: "qwen3-embedding"
      timeout_seconds: 60
      max_retries: 1
  cloud:
    default: "openai-compatible"
    openai_compatible:
      base_url: "https://api.openai.com/v1"
      model: "gpt-4.1-mini"
      embedding_model: "text-embedding-3-small"
      api_key_env: "OPENAI_API_KEY"
      timeout_seconds: 60
      max_retries: 2

policies:
  privacy:
    deny_cloud_when_private: true
  complexity:
    local_max: "medium"
  tools:
    approval_required_patterns:
      - "delete"
      - "remove"
      - "drop"
      - "reset"
      - "write"
      - "edit"
      - "commit"
      - "push"
      - "deploy"
      - "merge"
      - "purchase"
      - "payment"
      - "pay"
      - "transfer"
      - "email"
      - "send"
      - "shell"
      - "exec"
      - "terminal"
    review_recommended_patterns:
      - "read"
      - "search"
      - "fetch"
      - "browser"
      - "web"
      - "database"
      - "db"
      - "filesystem"
      - "file"
      - "calendar"
      - "issue"
      - "ticket"
    trusted_tool_patterns: []

telemetry:
  costs:
    local_request_cost_usd: 0.0002
    cloud_request_cost_usd: 0.02
